# 전략실 탐색용 한도 — r3-trend v7 사용자 위험 규칙(1회 위험 1%, 최대 2%) 시험. **사용자 미결정 한도 가정, 운영 파일 아님.**
# 운영 연구 프로필(limits.research.toml, A-093)은 L1 0.5%·L2 10%라 손절 8%·위험 1%(비중 12.5%)를 막는다 — 실제 적용은 운영 CP 사항.
# 바꾼 값(연구 프로필 대비): L1 0.005→0.02(사용자 최대 2%; 게이트는 기준가+3% 여유로 위험을 재므로 12.5% 비중 ≈ 1.4%),
#   L2 0.10→0.30·L3 0.30→0.90(피라미딩 0.5배 + 상승분, 게이트는 상한가 ×1.3 기준), L7 0.10→0.20(12.5% × 1.3 = 16.3%, 첫 시험에서 0.15는 전부 G7 거부), L4 0.02→0.03(3종목 × 12.5% 동시 급락 여유).
