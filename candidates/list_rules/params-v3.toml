# list-rules v3 보수형 프로필(기본). 값은 2026-10-11 타이밍·청산·피라미딩 연구에서 사전 고정했던 값 그대로(조정 없음).
strategy = "list-rules"
version = 3

[params]
exit_mode = "sma"      # 보수형: SMA(20) 이탈 청산 (T2 최악 10% 최소)
sma_n = 20
stop_pct = "0.07"      # 공격형 프로필에서만 사용(exit_mode = "fixed")
hold_max = 120
reentry_wait = 0
regime_n = 200         # KOSPI > SMA200 때만 신규 진입 (v4 검증 중 — 운영 리스크 관점 기본 켬)
atr_mult = "2"
risk_ratio = "0.004"
max_weight = "0.09"
order_cap = "1000000"
