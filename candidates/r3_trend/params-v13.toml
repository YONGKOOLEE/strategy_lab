# r3-trend v13 = v12 + min_turnover·rank_by·max_pos 상한 100. 기본값(0·rs) = v12 동작.
# 사전 등록 research/2026-10-14-r3v7-explore-design.md "stage7" 절(2026-10-16)
strategy = "r3-trend"
version = 13

[params]
stop_pct = "0.08"       # 사용자 −8% (1R)
tp_r = "3"              # 1:3 → 1차 익절 +24%
exit_mode = "all"       # 탐색 2단계 최상(all) — stage2b에서 거래량 2배로 재확인
exit_sma_n = 50
trail_atr = "3"
pyr_at = "0"            # stage3 축: 0.08 / 0.12 / 0.16
pyr_stop = "e0"         # stage3 축: none / half / e0 / avg (e0 = v7 동작)
adv_min = "0.5"         # 사용자 +50% (탐색 1단계 축 0.3/0.5/0.7)
adv_n = 126             # 사전 상승 측정 = H 이전 약 6개월
base_min = 15           # 조정 3주 이상
base_max = 60           # 조정 고점 탐색 12주
depth_min = "0.05"
depth_max = "0.35"      # 탐색 1단계 축 0.25/0.35
vol_mult = "2.0"        # 탐색 1단계 최상 영역
rs_min = "70"           # 사용자 RS 70
hold_max = 250
max_pos = 3             # stage5 축: 3 / 5 / 8 (한도 사본 L6 8)
align = "both"          # stage6 축: both / daily / none
entry_mode = "base"     # stage7: high52
fresh_n = 20            # high52: 직전 20거래일 신고가 없던 새 신고가
min_turnover = "0"      # 억 원, 0 = 없음 (stage10 축)
rank_by = "rs"          # rs / turnover / day_ret (stage10 축)
regime_n = 0            # 국면은 배분 규칙(regime_kospi) 담당
risk_ratio = "0.01"     # 사용자: 보통 1%
max_weight = "0.20"     # 1% / 8% = 12.5% + 피라미딩 0.5배 여유
order_cap = "100000000" # 사실상 없음(한도 파일이 통제)
