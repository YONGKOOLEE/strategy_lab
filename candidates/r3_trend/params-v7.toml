# r3-trend v7 — 사용자 규칙 정정(2026-10-14). 1·2·3(익절·피라미딩·타점)은 탐색으로 고른다(사용자: 직접 정하기 어려움).
# 이 파일 = 탐색 1단계 기준값(제안값). 사전 등록 research/2026-10-14-r3v7-explore-design.md
strategy = "r3-trend"
version = 7

[params]
stop_pct = "0.08"       # 사용자 −8% (1R)
tp_r = "3"              # 1:3 → 1차 익절 +24%
exit_mode = "half_sma"  # 탐색 2단계 축: all / half_sma / half_trail / trail
exit_sma_n = 50
trail_atr = "3"
pyr_at = "0"            # 탐색 2단계 축: 0 / 0.04 / 0.08
adv_min = "0.5"         # 사용자 +50% (탐색 1단계 축 0.3/0.5/0.7)
adv_n = 126             # 사전 상승 측정 = H 이전 약 6개월
base_min = 15           # 조정 3주 이상
base_max = 60           # 조정 고점 탐색 12주
depth_min = "0.05"
depth_max = "0.35"      # 탐색 1단계 축 0.25/0.35
vol_mult = "1.5"        # 탐색 1단계 축 1.5/2.0
rs_min = "70"           # 사용자 RS 70
hold_max = 250
regime_n = 0            # 국면은 배분 규칙(regime_kospi) 담당
risk_ratio = "0.01"     # 사용자: 보통 1%
max_weight = "0.20"     # 1% / 8% = 12.5% + 피라미딩 0.5배 여유
order_cap = "100000000" # 사실상 없음(한도 파일이 통제)
