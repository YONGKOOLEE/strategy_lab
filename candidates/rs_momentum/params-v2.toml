# rs-momentum v2 — v1 + reentry_wait(사전 등록 notes.md 2026-10-10). 다른 값은 v1과 같다. 소수는 문자열로 적는다.
strategy = "rs-momentum"
version = 2

[params]
mom_n = 120          # v1과 같음
trend_n = 100        # v1과 같음
exit_rank = 6        # v1과 같음
reentry_wait = 10    # 청산 뒤 재진입 대기 확정 일봉 수 — 문제 왕복(보유 ≤ 5일)의 2배, 사전 결정값
atr_mult = "2"       # v1과 같음(L7 지배로 크기에 영향 없음, 기록용)
risk_ratio = "0.004"
max_weight = "0.09"
