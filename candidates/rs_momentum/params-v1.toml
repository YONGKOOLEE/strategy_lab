# rs-momentum v1 — 사전 등록 초기값(notes.md). 값을 바꾸면 버전을 올린다. 소수는 문자열로 적는다.
strategy = "rs-momentum"
version = 1

[params]
mom_n = 120          # 약 6개월(거래일) — 횡단면 모멘텀 문헌의 표준 구간(6~12개월) 중 짧은 쪽, 30종목·보유 3에 맞춰 교체가 너무 느리지 않게
trend_n = 100        # 약 5개월 이동평균 추세 필터 — mom_n보다 짧게 두어 하락 전환 때 청산이 먼저 걸리게
exit_rank = 6        # 보유 상한 3의 2배 — 순위 교체 비용을 줄이는 히스테리시스
atr_mult = "2"       # 크기 계산용 손절 거리(견본과 같음, 조정 안 함)
risk_ratio = "0.004" # 1회 위험 = 기준 금액 × 0.4% (계좌 L1 0.5% 이하)
max_weight = "0.09"  # 종목 비중 상한 9% (계좌 L2 10% 이하)
